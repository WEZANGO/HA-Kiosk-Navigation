name: HERE Traffic Dashboards
version: 0.3.7
slug: here_traffic_dashboards
description: Create shared-key HERE traffic route displays for Home Assistant dashboards.
url: https://github.com/example/here-traffic-dashboards
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:traffic-light
panel_title: HERE Traffic
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct access for an iframe when Home Assistant ingress is unavailable
options:
  here_api_key: ""
schema:
  here_api_key: password
backup: hot
